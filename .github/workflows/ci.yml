name: PHP e integrações
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: ci_disposable_password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: lume_test_ci
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_disposable_password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: app
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 33306
      DB_DATABASE: lume_test_ci
      DB_USERNAME: root
      DB_PASSWORD: ci_disposable_password
      TEST_DB_DSN: mysql:host=127.0.0.1;port=33306;dbname=lume_test_ci
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci_disposable_password
      ALBUM_TEST_DB_HOST: 127.0.0.1
      ALBUM_TEST_DB_PORT: 33306
      ALBUM_TEST_DB_USER: root
      ALBUM_TEST_DB_PASSWORD: ci_disposable_password
      APP_ENV: local
      APP_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, gd, zip, fileinfo, curl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php scripts/install.php
      - run: php scripts/migrate.php
      - run: php tests/security.php
      - run: php tests/backend_integration.php
      - run: php tests/notifications_integration.php
      - run: php tests/albums_http.php
