name: PHP e integrações
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: ci_disposable_password
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: lume_test_ci
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_disposable_password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    defaults:
      run:
        working-directory: app
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 33306
      DB_DATABASE: lume_test_ci
      DB_USERNAME: root
      DB_PASSWORD: ci_disposable_password
      TEST_DB_DSN: mysql:host=127.0.0.1;port=33306;dbname=lume_test_ci
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci_disposable_password
      ALBUM_TEST_DB_HOST: 127.0.0.1
      ALBUM_TEST_DB_PORT: 33306
      ALBUM_TEST_DB_USER: root
      ALBUM_TEST_DB_PASSWORD: ci_disposable_password
      APP_ENV: local
      APP_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, gd, zip, fileinfo, curl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer validate --strict
      - run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php scripts/install.php
      - run: php scripts/migrate.php
      - run: php tests/environment.php
      - run: php tests/security.php
      - run: php tests/backend_integration.php
      - run: php tests/notifications_integration.php
      - run: php tests/albums_http.php

  container-smoke:
    name: Docker Compose e Apache
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Preparar configuração descartável
        run: |
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.env')
          values = {
              'APP_ENV': 'local',
              'APP_URL': 'http://localhost:8080',
              'APP_PORT': '8080',
              'DB_DATABASE': 'lume_container_ci',
              'DB_USERNAME': 'lume_ci',
              'DB_PASSWORD': 'ci_disposable_app_password',
              'DB_ROOT_PASSWORD': 'ci_disposable_root_password',
              'DB_FORWARD_PORT': '33307',
              'MAILPIT_PORT': '18025',
          }
          path.write_text('\n'.join(
              key + '=' + values[key] if '=' in line and (key := line.split('=', 1)[0]) in values else line
              for line in path.read_text().splitlines()
          ) + '\n')
          PY
      - name: Construir e iniciar a stack real
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Instalar e verificar migração idempotente
        run: |
          docker compose exec -T app php scripts/install.php
          docker compose exec -T app php scripts/migrate.php
      - name: Criar administrador sintético pela entrada padrão
        run: |
          printf '%s\n' 'CI Container Admin' 'container-admin@example.invalid' 'ci_disposable_Only_For_Test_123!' 'ci_disposable_Only_For_Test_123!' |
            docker compose exec -T app php scripts/create-admin.php
      - name: Verificar páginas públicas e WebP
        run: |
          status=$(curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/ -o /tmp/lume-home.html -w '%{http_code}')
          test "$status" = 200 || { echo "Home retornou $status, esperado 200"; exit 1; }
          grep -q 'Lume Estúdio' /tmp/lume-home.html
          for path in login.php login-cliente.php; do
            status=$(curl --silent --show-error -o /tmp/lume-login.html -w '%{http_code}' "http://localhost:8080/$path")
            test "$status" = 200 || { echo "$path retornou $status, esperado 200"; exit 1; }
          done
          curl --fail --silent --show-error -D /tmp/lume-webp.headers http://localhost:8080/assets/demo/hero.webp -o /tmp/lume-hero.webp
          grep -qi '^Content-Type: image/webp' /tmp/lume-webp.headers
          python3 - <<'PY'
          from pathlib import Path
          data = Path('/tmp/lume-hero.webp').read_bytes()
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'Imagem WebP inválida'
          PY
      - name: Verificar proteção de arquivos no Apache
        run: |
          docker compose exec -T app php -r 'if (file_put_contents("storage/smoke.txt", "private smoke fixture") === false) { exit(1); }'
          for path in .env.example database.sql src/helpers.php scripts/install.php composer.json storage/smoke.txt vendor/autoload.php database/migrations/002_albums.sql docker/php.ini; do
            status=$(curl --silent --show-error -o /tmp/lume-denied.html -w '%{http_code}' "http://localhost:8080/$path")
            test "$status" = 403 || { echo "$path retornou $status, esperado 403"; exit 1; }
            echo "403 confirmado: $path"
          done
      - name: Exibir diagnóstico se houver falha
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color app db mailpit
      - name: Encerrar ambiente descartável
        if: always()
        run: docker compose down --volumes --remove-orphans
